  <text x="72" y="328" fill="#5C564C" font-size="22" font-weight="430">Round-robin and collective team booking.</text>
  <text x="72" y="362" fill="#5C564C" font-size="22" font-weight="430">Self-host is free. A hosted plan is on the way.</text>

